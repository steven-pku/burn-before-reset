name: Audit finding
description: You reviewed the code and found something — a defect, a weak guarantee, or a claim that does not hold
labels: [audit]
body:
  - type: markdown
    attributes:
      value: "Suspected unauthorized actions or billing? Use [private vulnerability reporting](https://github.com/steven-pku/burn-before-reset/security/advisories/new). Do not post exploit details here."
  - type: checkboxes
    id: safety
    attributes:
      label: Public disclosure check
      options:
        - label: This report contains no security exploit details, credentials, private paths or session transcripts.
          required: true
  - type: input
    id: location
    attributes:
      label: Where
      placeholder: src/burn_before_reset/worker.py:312
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [high — wrong result silently, medium — wrong result visibly, low — clarity or docs]
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: The finding
      description: What is wrong, and why it matters for an unattended run.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction path
      description: Inputs → observed behaviour. If you could not reproduce it, say so — a labelled hypothesis is still welcome.
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix (optional)
