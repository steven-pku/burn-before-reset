name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
          args: check --output-format=github
      - name: Lint the workflows themselves
        uses: raven-actions/actionlint@v2

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and integration tests
        run: python scripts/check.py

      - name: Release version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check.py --release-tag "${{ github.ref_name }}"

      - name: First-use demo (no model calls)
        run: python scripts/demo.py --output "${{ runner.temp }}/bbr-demo"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install a wheel without runtime dependencies
        run: |
          python -m pip wheel --no-deps . -w "${{ runner.temp }}/wheels"
          python -m venv "${{ runner.temp }}/installed"
          "${{ runner.temp }}/installed/bin/python" -m pip install --no-index --no-deps "${{ runner.temp }}"/wheels/*.whl
          "${{ runner.temp }}/installed/bin/python" -m pip check
      - name: Installed CLI, task failure and recovery (mock only)
        run: |
          "${{ runner.temp }}/installed/bin/python" scripts/check_install.py "$PWD" "${{ runner.temp }}/mock checks"
      - name: Package the independent Skill
        run: python scripts/package_skill.py --output "${{ runner.temp }}/skill"
