[run]
# The OUTER reset (usually weekly), from the official usage UI. The run rides the
# inner ~5h windows on its own: a closed window pauses the run, only this stops it.
reset_at = "2099-01-01T03:00:00+08:00"
safety_buffer_minutes = 15
drain_window_minutes = 30
mode = "safe"
# Run directories hold redacted excerpts of your own notes and are created 0700.
# Keep them off /tmp: it is world-readable and the OS clears it, so the receipts
# you meant to review in the morning may not survive the night.
output_root = "~/burn-before-reset-runs"
# Ride inner allowance windows: on exhaustion, sleep and retry until replenished.
wait_for_replenish = true
quota_replenish_probe_minutes = 20
# When the queue drains with usable time left, re-plan from fresh signals.
replan_when_queue_empty = true

[billing]
# These are user assertions, not automated account verification.
subscription_auth_only = true
user_asserts_credit_balance_zero = true
user_asserts_auto_top_up_off = true
allow_api_key = false
allow_paid_credits = false
allow_provider_fallback = false

[execution]
# Plan-only is the default. Enabling this still requires CLI --execute.
enabled = false
codex_binary = "codex"
max_tasks = 3
# Absolute per-run cap on worker launches: first attempts, quota retries, and
# re-planned rounds all count. A runaway backstop — the tool cannot see the
# provider's quota pool, so this is the one spend bound it can enforce itself.
max_worker_calls_per_run = 500
task_timeout_seconds = 900
sigint_grace_seconds = 20
sigterm_grace_seconds = 10

[task_policy]
minimum_score = 12
maximum_risk = 2
maximum_human_dependency = 1
max_candidates = 50

[[sources]]
type = "markdown"
root = "/absolute/path/to/allowed/notes"
extensions = [".md"]
exclude_fragments = [".git", ".obsidian", "attachments", "health", "finance", "clients", "private"]
max_file_bytes = 262144

[[sources]]
type = "git"
root = "/absolute/path/to/allowed/repository"
extensions = [".md", ".py", ".ts", ".tsx", ".js", ".go", ".rs"]
exclude_fragments = [".git", "node_modules", "vendor", "dist", "build"]
max_file_bytes = 262144
